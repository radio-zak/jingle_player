opencollection: 1.0.0

info:
  name: Jingle Player Backend
config:
  protobuf:
    protoFiles:
      - type: file
        path: ../control.proto
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: grpc
        url: localhost:6969
