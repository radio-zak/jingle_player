name: Build Windows App Installer - alpha
on:
  push:
    tags:
      - "**-alpha*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Flutter
        uses: subosito/flutter-action@v2

      - name: Build Windows App
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --build-name ${{ github.ref_name }} --build-number ${{ github.run_number }}

      - name: Build iss script
        run: dart run inno_bundle:build --no-app --release --no-installer --app-version ${{ github.ref_name }}

      - name: Output config into github output
        id: envs
        # thanks to https://github.com/actions/runner/issues/2224#issuecomment-1289925992
        run: echo $(dart run inno_bundle:build --envs --no-hf --app-version ${{ github.ref_name }}) | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Fix ISS script languages
        run: |
          $issPath = "./build/windows/x64/installer/Release/inno-script.iss"
          $content = Get-Content $issPath -Raw
          # Remove any language line whose .isl file doesn't exist on disk
          $lines = Get-Content $issPath
          $fixed = $lines | Where-Object {
            if ($_ -match '\.isl"') {
              $match = [regex]::Match($_, '"([^"]+\.isl)"')
              if ($match.Success) {
                $path = $match.Groups[1].Value
                Test-Path $path  # only keep line if file actually exists
              } else { $true }
            } else { $true }
          }
          $fixed | Set-Content $issPath
          Write-Host "Final languages in ISS:"
          $fixed | Where-Object { $_ -match '\.isl' }

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: ./build/windows/x64/installer/Release/inno-script.iss

      - name: Release installer
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./build/windows/x64/installer/Release/${{ steps.envs.outputs.APP_NAME_CAMEL_CASE }}-x86_64-${{ steps.envs.outputs.APP_VERSION }}-Installer.exe
          name: "${{ steps.envs.outputs.APP_VERSION }}"
          target_commitish: "${{ github.sha }}"
          tag_name: "${{ github.ref_name }}"
          prerelease: true
          generate_release_notes: true
